<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vigi-Drive - Drowsiness Detection System</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>
  <nav class="navbar navbar-expand-lg navbar-dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="{{ url_for('index') }}"> Vigi-Drive</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'home' %}active{% endif %}"
              href="{{ url_for('home') }}">Home</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'monitor' %}active{% endif %}"
              href="{{ url_for('monitor') }}">Live Monitor</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'events' %}active{% endif %}"
              href="{{ url_for('events') }}">Events</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'analytics' %}active{% endif %}"
              href="{{ url_for('analytics') }}">Analytics</a></li>
          <li class="nav-item"><a class="nav-link {% if request.endpoint == 'about' %}active{% endif %}"
              href="{{ url_for('about') }}">About</a></li>
        </ul>
        <ul class="navbar-nav ms-auto mb-2 mb-lg-0 align-items-center">
          {% if current_user.is_authenticated %}
          <li class="nav-item">
            <span class="navbar-text me-3 text-dark">👤 {{ current_user.name or current_user.email }}</span>
          </li>
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('logout') }}">Logout</a>
          </li>
          {% else %}
          <li class="nav-item">
            <a class="nav-link" href="{{ url_for('login') }}">Login </a>
          </li>
          {% endif %}
        </ul>
      </div>
    </div>
  </nav>

  <main class="container mt-4 mb-5">
    {% block content %}{% endblock %}
  </main>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
  {% block extra_js %}{% endblock %}
</body>

</html>
